<svg width="1024" height="1024" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ittizanCopper" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A4B12" />
      <stop offset="50%" stop-color="#D97724" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="ittizanCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="ittizanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#090B0E" />
    </linearGradient>
  </defs>

  <!-- Dark Background Canvas with Rounded Border -->
  <rect width="120" height="120" rx="26" fill="url(#ittizanBg)" />
  <rect x="2" y="2" width="116" height="116" rx="24" stroke="#262B36" stroke-width="2" />
  
  <!-- Subtle Calibration Orbit & Vertical 90° Equilibrium Axis -->
  <circle cx="60" cy="60" r="44" stroke="#1E2330" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="60" y1="12" x2="60" y2="108" stroke="#1E2330" stroke-width="1.5" />

  <!-- Left Bean Half: Ascending Bean Temp (BT - Maillard Copper) -->
  <path
    d="M 60 20 C 34 20, 22 38, 22 60 C 22 82, 34 100, 60 100 C 52 84, 48 72, 60 60 C 72 48, 68 34, 60 20 Z"
    fill="url(#ittizanCopper)"
    opacity="0.95"
  />

  <!-- Right Bean Half: Declining Rate of Rise (RoR - Convection Cyan) -->
  <path
    d="M 60 20 C 86 20, 98 38, 98 60 C 98 82, 86 100, 60 100 C 68 84, 72 72, 60 60 C 48 48, 52 34, 60 20 Z"
    stroke="url(#ittizanCyan)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Intersecting Ghost RoR Trajectory -->
  <path
    d="M 28 42 Q 60 52 92 84"
    stroke="#10B981"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="2 3"
  />

  <!-- Turning Point & First Crack Focal Points -->
  <circle cx="28" cy="42" r="3.5" fill="#38BDF8" />
  <circle cx="60" cy="60" r="4" fill="#FFFFFF" />
  <circle cx="92" cy="84" r="3.5" fill="#F59E0B" />
</svg>